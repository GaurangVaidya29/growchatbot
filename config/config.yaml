scraping:
  timeout_seconds: 20
  max_retries: 2
  follow_links: false
  max_response_bytes: 5000000
  min_extracted_characters: 100
  user_agent: GrowwMFFAQDemo/0.1 (facts-only educational prototype)

chunking:
  target_tokens: 400
  overlap_tokens: 50

embeddings:
  provider: sentence_transformers
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize: true

vector_db:
  provider: chroma
  collection: groww_hdfc_mf_faq
  persist_directory: data/chroma

retrieval:
  top_k: 5
  score_threshold: 0.50

response:
  max_sentences: 3
  citation_count: 1

